; RainSplashesF4SE — RainSplashesF4SE.ini must sit next to RainSplashesF4SE.dll (same folder).
; Based on Splashes of Storms (Skyrim) by powerof_three — rain proxy tiers differ on FO4.

[Global]
MasterEnabled = true
DebugSplashes = false
DebugRipples = false
CoverThreshold = 200.0
RainDensityLightThreshold = 5.0
RainDensityHeavyThreshold = 9.0
RainProxyWetnessScale = 20.0
RainProxyWindScale = 2.0
RainProxyBase = 5.0

[LightRain]
Enabled = true
RaycastRadius = 1024.0
RaycastIterations = 2
SplashEnabled = true
SplashNif = Meshes\Effects\Rain\rain_rainSplashGround_genericA.NIF
SplashNifActor = Meshes\Effects\Rain\rain_rainSplashGround_genericA.NIF
SplashNifScale = 0.5
SplashNifScaleActor = 0.4
SplashLifetime = 1.0
RippleEnabled = true
RippleRaycastRadius = 1024.0
RippleRaycastIterations = 15
RippleDisplacementMult = 0.3

[MediumRain]
Enabled = true
RaycastRadius = 1024.0
RaycastIterations = 3
SplashEnabled = true
SplashNif = Meshes\Effects\Rain\rain_rainSplashGround_genericA.NIF
SplashNifActor = Meshes\Effects\Rain\rain_rainSplashGround_genericA.NIF
SplashNifScale = 0.5
SplashNifScaleActor = 0.4
SplashLifetime = 1.0
RippleEnabled = true
RippleRaycastRadius = 1024.0
RippleRaycastIterations = 20
RippleDisplacementMult = 0.3

[HeavyRain]
Enabled = true
RaycastRadius = 1024.0
RaycastIterations = 5
SplashEnabled = true
SplashNif = Meshes\Effects\Rain\rain_rainSplashGround_genericA.NIF
SplashNifActor = Meshes\Effects\Rain\rain_rainSplashGround_genericA.NIF
SplashNifScale = 0.55
SplashNifScaleActor = 0.45
SplashLifetime = 1.0
RippleEnabled = true
RippleRaycastRadius = 1024.0
RippleRaycastIterations = 25
RippleDisplacementMult = 0.3
